<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Friday">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2029"/>
      <stop offset="1" stop-color="#1A3A5C"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B3273B" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#B3273B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#bloom)"/>
    <rect width="512" height="512" fill="url(#spec)"/>
    <!-- encryption orbit: a sealed boundary around the mark -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#F0E8D8" stroke-opacity="0.20" stroke-width="4" stroke-dasharray="10 26"/>
    <!-- the F constellation, centred -->
    <g stroke="#F0E8D8" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round">
      <line x1="196" y1="166" x2="196" y2="346"/>
      <line x1="196" y1="166" x2="332" y2="166"/>
      <line x1="196" y1="256" x2="306" y2="256"/>
      <line x1="196" y1="346" x2="306" y2="256"/>
    </g>
    <g fill="#B3273B">
      <g filter="url(#halo)" opacity="0.5">
        <circle cx="196" cy="166" r="30"/><circle cx="332" cy="166" r="30"/>
        <circle cx="196" cy="256" r="32"/><circle cx="306" cy="256" r="26"/>
        <circle cx="196" cy="346" r="30"/>
      </g>
      <circle cx="196" cy="166" r="23"/><circle cx="332" cy="166" r="23"/>
      <circle cx="196" cy="256" r="25"/><circle cx="306" cy="256" r="19.5"/>
      <circle cx="196" cy="346" r="23"/>
    </g>
    <g fill="#F4EFE6">
      <circle cx="196" cy="166" r="9.5"/><circle cx="332" cy="166" r="9.5"/>
      <circle cx="196" cy="256" r="10.4"/><circle cx="306" cy="256" r="8.2"/>
      <circle cx="196" cy="346" r="9.5"/>
    </g>
    <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>
