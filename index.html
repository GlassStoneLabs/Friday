<!doctype html>
<html lang="en" data-theme="light" data-accent="carmine" data-wallpaper="noon">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Friday — Eros Office</title>
  <meta name="description" content="Friday — the Eros Office desktop by Glass Stone LLC. A secure mesh-network workspace, rendered in the Hudson Design Language.">
  <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Friday">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@400;500;600&family=Martian+Mono:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/friday.css">
</head>
<body>
  <div id="boot" aria-hidden="true">
    <img src="assets/logo.svg" alt="" width="96" height="96">
    <div class="boot-name">Friday</div>
    <div class="boot-sub">EROS OFFICE · GLASS STONE</div>
  </div>

  <div id="desktop">
    <div id="wallpaper"></div>

    <header id="menubar" class="glass-bar">
      <div class="mb-left">
        <button class="mb-item mb-logo" id="mb-friday" aria-label="Friday menu">
          <svg viewBox="0 0 512 512" width="15" height="15" aria-hidden="true">
            <g stroke="currentColor" stroke-width="34" stroke-linecap="round" fill="none">
              <line x1="182" y1="131" x2="182" y2="389"/>
              <line x1="182" y1="131" x2="358" y2="131"/>
              <line x1="182" y1="259" x2="320" y2="259"/>
            </g>
            <g fill="currentColor">
              <circle cx="182" cy="131" r="52"/><circle cx="358" cy="131" r="52"/>
              <circle cx="182" cy="259" r="52"/><circle cx="320" cy="259" r="46"/>
              <circle cx="182" cy="389" r="52"/>
            </g>
          </svg>
        </button>
        <button class="mb-item mb-appname" id="mb-appname">Friday</button>
        <div id="mb-menus"></div>
      </div>
      <div class="mb-right">
        <button class="mb-item" id="mb-mesh" title="Dark Core mesh">
          <span class="mesh-dot"></span><span id="mb-mesh-count">24</span>
        </button>
        <button class="mb-item" id="mb-search" title="Search (⌘K)">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6.8" cy="6.8" r="4.6"/><line x1="10.3" y1="10.3" x2="14" y2="14"/></svg>
        </button>
        <button class="mb-item" id="mb-cc" title="Control Center">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.2" y="2.6" width="13.6" height="4.4" rx="2.2"/><rect x="1.2" y="9" width="13.6" height="4.4" rx="2.2"/><circle cx="4.8" cy="4.8" r="1.3" fill="currentColor" stroke="none"/><circle cx="11.2" cy="11.2" r="1.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="mb-item mb-clock" id="mb-clock">Fri 9:41 AM</button>
      </div>
    </header>

    <main id="windows" aria-live="polite"></main>

    <nav id="dock-wrap"><div id="dock" class="glass"></div></nav>

    <div id="spotlight-veil" hidden>
      <div id="spotlight" class="glass" role="dialog" aria-label="Search">
        <input id="spotlight-input" type="text" placeholder="Search Friday" autocomplete="off" spellcheck="false">
        <ul id="spotlight-results"></ul>
        <div class="spotlight-foot">EROS OFFICE · MESH SEARCH IS LOCAL &amp; ENCRYPTED</div>
      </div>
    </div>

    <div id="control-center" class="glass" hidden></div>
    <div id="menu-layer"></div>

    <div id="mobile-root" hidden>
      <header id="m-top" class="glass-bar">
        <svg viewBox="0 0 512 512" width="17" height="17" aria-hidden="true">
          <g stroke="currentColor" stroke-width="34" stroke-linecap="round" fill="none">
            <line x1="182" y1="131" x2="182" y2="389"/><line x1="182" y1="131" x2="358" y2="131"/><line x1="182" y1="259" x2="320" y2="259"/>
          </g>
          <g fill="currentColor">
            <circle cx="182" cy="131" r="52"/><circle cx="358" cy="131" r="52"/><circle cx="182" cy="259" r="52"/><circle cx="320" cy="259" r="46"/><circle cx="182" cy="389" r="52"/>
          </g>
        </svg>
        <span id="m-title" class="mono">TODAY · EROS OFFICE</span>
        <button id="m-theme" aria-label="Toggle appearance">◐</button>
      </header>
      <main id="m-surface" class="win-body"></main>
      <nav id="m-tabs" class="glass"></nav>
      <div id="m-sheet-veil" hidden><div id="m-sheet" class="glass"></div></div>
    </div>
  </div>

  <script src="js/friday.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
